<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azai Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: mobile-first app shell. Top bar + slide-in drawer + bottom tabs; drawer becomes a fixed sidebar from 900px. */
:root{
  --bg:#fbf7f7; --surface:#ffffff; --surface2:#f6eff0; --line:#ecdfe1;
  --fg:#241618; --muted:#7d6a6d; --accent:#c8102e; --accent-ink:#ffffff; --accent-soft:#fdecee;
  --ok:#1f8a4c; --ok-soft:#e5f5ec; --warn:#b45309; --warn-soft:#fdf1dc; --bad:#b4151f; --bad-soft:#fde8ea; --info:#1d5fa8; --info-soft:#e6f0fb;
  --shadow:0 1px 2px rgba(60,10,20,.05);
  --f-display:'Bricolage Grotesque','Onest',system-ui,sans-serif; --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150e0f; --surface:#1e1416; --surface2:#271b1e; --line:#37262a;
  --fg:#f6ecee; --muted:#b09ba0; --accent:#ff5468; --accent-ink:#2a0509; --accent-soft:#3a1519;
  --ok:#5fd08c; --ok-soft:#14301f; --warn:#f0b35a; --warn-soft:#352610; --bad:#ff8a93; --bad-soft:#3d1519; --info:#7db4f2; --info-soft:#13263d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150e0f; --surface:#1e1416; --surface2:#271b1e; --line:#37262a;
  --fg:#f6ecee; --muted:#b09ba0; --accent:#ff5468; --accent-ink:#2a0509; --accent-soft:#3a1519;
  --ok:#5fd08c; --ok-soft:#14301f; --warn:#f0b35a; --warn-soft:#352610; --bad:#ff8a93; --bad-soft:#3d1519; --info:#7db4f2; --info-soft:#13263d; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.15} h2{font-size:17px} h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)} .sm{font-size:12px} .eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.tnum{font-variant-numeric:tabular-nums}

/* login */
.login{min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.login-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:linear-gradient(100deg,var(--surface) 55%,var(--accent-soft))}
.login-body{flex:1;display:flex;align-items:center;justify-content:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.login-card{width:100%;max-width:380px;display:grid;gap:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line);color:#e11d3a;display:grid;place-items:center;flex:none}
.logo svg{width:28px;height:28px}
.brand b{font-family:var(--f-display);font-size:16px;display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--muted)}
label{display:grid;gap:5px;font-size:12px;font-weight:500}
input[type=text],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;min-height:40px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn svg,.ico{width:16px;height:16px;flex:none}
.demo{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.demo-row{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--bad);font-size:12px}

/* shell */
.app{min-height:100%;display:flex}
.side{position:fixed;inset:0 auto 0 0;width:min(280px,84vw);background:var(--surface);border-right:1px solid var(--line);z-index:30;transform:translateX(-102%);transition:transform .2s ease;display:flex;flex-direction:column;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.side.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(20,5,8,.45);z-index:25}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 12px}
.who{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:11px;padding:10px;margin-bottom:14px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 8px 5px}
.nav-a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--fg);text-decoration:none;font-weight:500}
.nav-a:hover{background:var(--surface2)}
.nav-a.on{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;display:grid;gap:8px;padding-top:16px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface2)}
.pill-user{margin:0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:3px 12px 3px 5px;background:var(--surface);min-width:0}
.pill-user div{min-width:0;line-height:1.2}
.pill-user b{font-weight:500;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 8px;font-size:11px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--fg)}
.page{width:100%;max-width:820px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px;align-content:start}
.bottom{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
.bottom a{display:grid;justify-items:center;gap:2px;padding:9px 4px 8px;font-size:11px;color:var(--muted);text-decoration:none;border-top:2px solid transparent}
.bottom a.on{color:var(--accent);border-top-color:var(--accent)}
@media (min-width:900px){
  .side{transform:none;position:fixed;width:260px}
  .main{margin-left:260px}
  .menu-btn,.scrim{display:none}
  .bottom{display:none}
  .page{padding-bottom:48px}
  .top{padding-left:24px}
}

/* content blocks */
.head{display:grid;gap:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card.pad{padding:16px}
.sect{display:grid;gap:8px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.link{color:var(--accent);font-weight:600;text-decoration:none;font-size:13px;background:none;border:0;padding:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stats>div{padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.stats>div:first-child{border-left:0}
.stats small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.stats>div:nth-child(3){border-left:0}.stats>div:nth-child(n+3){border-top:1px solid var(--line)}}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-width:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:3px;font-size:12px;color:var(--muted)}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;padding:0;color:transparent}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk svg{width:13px;height:13px}
.done .t{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:11.5px;font-weight:500;background:var(--surface2);white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:500;white-space:nowrap;flex:none}
.b-bad{background:var(--bad-soft);color:var(--bad)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-info{background:var(--info-soft);color:var(--info)} .b-ok{background:var(--ok-soft);color:var(--ok)} .b-mute{background:var(--surface2);color:var(--muted)} .b-acc{background:var(--accent-soft);color:var(--accent)}
.lesson{display:flex;gap:14px;padding:11px 14px;align-items:center}
.lesson .tm{width:46px;flex:none;font-variant-numeric:tabular-nums;line-height:1.25}
.lesson .tm b{display:block;font-weight:600}
.lesson .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px;line-height:1.35}
.lesson .subj{font-weight:500;overflow-wrap:anywhere}
.lesson .room{display:flex;align-items:center;gap:6px;min-width:0;line-height:1.35}
.lesson .room svg{flex:none}
.lesson .room span{min-width:0;overflow-wrap:anywhere}
.avatar img,.avatar-btn img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.avatar-btn{overflow:hidden;padding:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.notice{padding:13px 14px;display:flex;gap:12px;align-items:flex-start}
.notice .ni{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;text-align:center;display:grid;gap:1px;font-size:11px;color:var(--muted)}
.day b{font-size:17px;color:var(--fg);font-family:var(--f-display)}
.day.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)} .day.on b{color:var(--accent)}
.day.today::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent);margin:1px auto 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:12.5px;font-weight:500}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;text-align:left;display:flex;gap:10px;align-items:center;width:100%}
.opt .n{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;color:var(--muted);flex:none}
.opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.bar{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.tabs{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--surface2);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tabs button span{font-size:10.5px;color:var(--accent);margin-left:4px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:34px 16px;text-align:center;display:grid;gap:5px;justify-items:center;color:var(--muted)}
.empty b{color:var(--fg);font-weight:600}
.empty .eic{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--muted);margin-bottom:4px}
.form{display:grid;gap:14px;padding:16px}
.ask-box{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px}
.ask-box input{border:0;outline:0;background:transparent;flex:1;min-width:0;padding:8px 0;min-height:36px}
.ask-box:focus-within{border-color:var(--accent)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (max-width:600px){.quick{grid-template-columns:1fr}}
.quick button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.answer{padding:16px;display:grid;gap:8px}
.answer p+p{margin-top:6px}
.src{display:flex;gap:6px;flex-wrap:wrap}
.drop{display:grid;justify-items:center;gap:8px;padding:30px 16px;text-align:center;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.preview{display:grid;gap:12px;padding:16px}
.preview img{max-height:240px;border-radius:10px;object-fit:contain;background:var(--surface2);width:100%}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:10px;counter-increment:s}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.plan .blk{display:flex;gap:12px;padding:11px 14px;align-items:center}
.plan .st{width:44px;font-variant-numeric:tabular-nums;font-weight:600;flex:none}
.plan .brk{background:var(--surface2);color:var(--muted);font-size:12px}
.score{font-family:var(--f-display);font-size:42px;color:var(--accent);line-height:1}
.mode{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
.mode.on{border-color:var(--accent);background:var(--accent-soft)}
.mode b{font-weight:600} .mode span{font-size:12px;color:var(--muted)}
.bubble{padding:12px 14px;border-radius:12px;max-width:92%;overflow-wrap:anywhere}
.bubble.me{background:var(--accent);color:var(--accent-ink);margin-left:auto}
.bubble.ai{background:var(--surface);border:1px solid var(--line)}
.chat{display:grid;gap:10px}
.cols2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:560px){.cols2{grid-template-columns:1fr}}
.hint{padding:10px 12px;background:var(--surface2);border-radius:9px;font-size:13px;display:flex;gap:8px;align-items:center}
.note{font-size:11.5px;color:var(--muted)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* responsive extras */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
img,svg,video{max-width:100%}
@media (max-width:600px){input[type=text],input[type=password],select,textarea,.ask-box input{font-size:16px}.page{padding-top:16px}h1{font-size:22px}}
@media (min-width:900px){.login-card{max-width:420px}.top{padding-right:24px}}
@media (min-width:1280px){.page{max-width:980px}}
/* fixes */
#root{min-height:100vh;min-height:100dvh}
.login,.app{min-height:100vh;min-height:100dvh}
.brand .logo,.logo{color:#e11d3a;font-size:inherit}
.brand .logo svg{color:#e11d3a}
.head{gap:8px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;line-height:1.3}
.eyebrow .ico{width:15px;height:15px}
.head h1{margin-top:2px}
/* top bar + account popover */
.top{gap:8px}
.top-act{display:flex;align-items:center;gap:2px;flex:none}
.pill-user{margin:0 auto;flex:0 1 auto;min-width:0;max-width:240px}
.pill-user .role{display:flex;align-items:center;gap:4px;white-space:nowrap}
.ico.xs{width:11px;height:11px}
.avatar-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0;margin-left:4px;flex:none}
.avatar-btn[aria-expanded="true"]{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
.avatar.big{width:40px;height:40px;font-size:13px}
.acct-pop{position:absolute;top:calc(100% + 8px);right:max(12px,env(safe-area-inset-right,0px));width:min(300px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -12px rgba(40,5,12,.35);padding:14px;display:grid;gap:12px;z-index:35;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .2s var(--ease),transform .25s var(--ease),visibility .2s}
.acct-pop.open{opacity:1;visibility:visible;transform:none}
.acct-who{display:flex;gap:12px;align-items:center;min-width:0}
.acct-who b{font-weight:600;display:block;overflow-wrap:anywhere}
.acct-note{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted);line-height:1.45}
@media (max-width:600px){
 .top{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));gap:6px}
 .icon-btn{width:32px;height:32px}
 .pill-user{padding:3px 10px 3px 4px;gap:6px}
 .pill-user .avatar{width:24px;height:24px;font-size:9px}

}

@media (min-width:900px){.acct-pop{right:24px}}
.enter .top .icon-btn:last-child svg{animation:none}

/* left/right corner alignment: hamburger glyph and avatar line up with page content (16px) */
@media (max-width:899px){.top{padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
@media (max-width:600px){.top{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.top .menu-btn.icon-btn{color:var(--fg);flex:none}
.top .logo.menu-btn{flex:none;margin-left:2px}
.acct-pop{right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.top{padding-left:24px;padding-right:24px}.acct-pop{right:24px}}
/* bottom nav adapts to 3 or 4 tabs */
.bottom{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
.bottom a{min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t,.lesson b,.head h1{hyphens:manual}

:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}

/* result of an action (applied once by JS) */
.fx{animation:rise .55s var(--ease) backwards}

.chk.fx svg path{stroke-dasharray:30;animation:draw .4s .08s ease-out backwards}

.opt.wrong.fx,.err.fx,.login-card input.fx{animation:shake .45s ease backwards}

/* interaction */
.btn,.chip,.opt,.mode,.day,.quick button,.icon-btn,.tabs button,.seg button,.nav-a,.chk,.row,.lesson,.notice,.drop{transition:background-color .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease),filter .25s}

input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px var(--accent-soft)}

/* drawer */
.side{transition:transform .45s var(--ease),box-shadow .45s var(--ease)}

.login{position:relative;overflow:hidden;isolation:isolate}

.login::before{width:340px;height:340px;background:var(--accent-soft);top:-80px;right:-60px;animation:drift1 14s ease-in-out infinite alternate}

 const first=ttWeek()[29].find(Boolean)||'mat';
 if(/ertaga|завтра|tomorrow/.test(s)&&/(birinchi|1|перв)/.test(s))return{src:'school',h:uz?`Ertaga, 29-oktabr, birinchi dars ${sn(first)}: ${SLOT[0][0]} da, ${ROOMS[first]}-xonada (${T[TEACH[first]]}).`:`Завтра, 29 октября, первый урок: ${sn(first)} в ${SLOT[0][0]}, кабинет ${ROOMS[first]} (${T[TEACH[first]]}).`};
 if(/bugun.*vazifa|vazifalarni|сегодня|домаш|topshir/.test(s)){const l=HW.filter(h=>(h.st==='o'||h.st==='t')&&!isDone(h));return{src:'school',h:(uz?'Bugun topshirish kerak:':'Сегодня нужно сдать:')+'<br>'+l.map(h=>`• ${L(h)} (${sn(h.s)}, ${L(h.due)})`).join('<br>')}}

function buildPlan(){
 const mult={easy:.75,bal:1,int:1.25}[S.plan.tempo],tasks=HW.filter(h=>!isDone(h)&&h.st!=='u').sort((a,b)=>({o:0,t:1,n:2}[a.st]-{o:0,t:1,n:2}[b.st]));
 const now=new Date();let start=new Date(now);start.setMinutes(Math.ceil(now.getMinutes()/10)*10,0,0);
 let cur=start.getHours()*60+start.getMinutes();const begin=cur,limit=cur+S.plan.min,out=[],left=[];
 tasks.forEach(h=>{let m=Math.max(15,Math.round(h.est/mult/5)*5);
  const room=limit-cur; if(room<15){left.push(h);return}
  if(m>room)m=Math.floor(room/5)*5;
  out.push({h,from:cur,m});cur+=m;if(S.plan.tempo!=='int'&&cur+15<=limit){out.push({brk:1,from:cur,m:5});cur+=5}});
 if(out.length&&out[out.length-1].brk)out.pop();
 return{out,left,begin}}
const hm=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;

function countUp(root){
 if(RM)return;
 root.querySelectorAll('.stats b,.score').forEach(el=>{
  const parts=el.textContent.split(/(\d+)/);if(parts.length<2)return;
  const t0=performance.now()+250,D=1000;
  const tick=now=>{const p=Math.max(0,Math.min(1,(now-t0)/D)),e=1-Math.pow(1-p,3);
   el.textContent=parts.map(x=>/^\d+$/.test(x)?Math.round(+x*e):x).join('');
   if(p<1)requestAnimationFrame(tick)};
  requestAnimationFrame(tick)})
}

  if(nb.length===oldBars.length)nb.forEach((el,i)=>{const w=el.style.width;if(oldBars[i]&&oldBars[i]!==w){el.style.width=oldBars[i];void el.offsetWidth;el.style.width=w}})}
 if(S.fx){root.querySelectorAll(S.fx).forEach((el,i)=>{el.classList.add('fx');el.style.animationDelay=Math.min(i,9)*50+'ms'});S.fx=null}
 if(S.sc){const el=root.querySelector(S.sc);if(el)requestAnimationFrame(()=>el.scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'}));S.sc=null}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 if(S.acct&&!e.target.closest('.acct-pop')&&!e.target.closest('[data-act="acct"]')){S.acct=false;document.querySelector('.acct-pop')?.classList.remove('open');document.querySelector('[data-act="acct"]')?.setAttribute('aria-expanded','false')}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
 switch(a){
  case'lang':vt(()=>{S.lang=v;try{localStorage.setItem('ps-lang',v)}catch(x){}render()});return;
  case'theme':{const n=isDark()?'light':'dark';vt(()=>{document.documentElement.dataset.theme=n;try{localStorage.setItem('ps-theme',n)}catch(x){}render()});return}
  case'drawer':S.drawer=!S.drawer;document.querySelector('.side')?.classList.toggle('open',S.drawer);document.querySelector('.scrim')?.classList.toggle('show',S.drawer);return;
  case'nav':S.drawer=false;document.querySelector('.side')?.classList.remove('open');document.querySelector('.scrim')?.classList.remove('show');return;
  case'acct':{S.acct=!S.acct;document.querySelector('.acct-pop')?.classList.toggle('open',S.acct);b.setAttribute('aria-expanded',S.acct);return}
   case'logout':S.acct=false;S.user=null;S.drawer=false;S.anim=true;break;
  case'demo':{const lg=document.getElementById('lg'),pw=document.getElementById('pw');lg.value=v;pw.value=ACC[v].pw;pw.focus();return}
  case'tog':{const id=+v;S.done.has(id)?S.done.delete(id):S.done.add(id);S.fx=S.done.has(id)?`.chk[data-act="tog"][data-v="${id}"]`:null;break}
  case'ptog':{const i=+v;S.pdone.has(i)?S.pdone.delete(i):S.pdone.add(i);S.fx=S.pdone.has(i)?`.chk[data-act="ptog"][data-v="${i}"]`:null;break}
  case'day':S.day=+v;S.fx='.lesson';break;
  case'filt':S.f=v;S.fx='.list>*';break;
  case'quick':S.ask.q=v;runAsk(v);return;
  case'pick':document.getElementById('fi').click();return;
  case'pickcam':document.getElementById('fc').click();return;
  case'pmin':S.plan.min=+v;S.plan.res=null;break;
  case'ptempo':S.plan.tempo=v;S.plan.res=null;break;
  case'mkplan':S.plan.res=buildPlan();S.fx='.plan>*';S.sc='.plan';break;
  case'qn':S.quiz.n=+v;break;
  case'qlvl':S.quiz.lvl=v;break;
  case'qstart':{const q=S.quiz;q.run={s:q.subj,topic:q.topic.trim(),i:0,pick:null,score:0,hint:false,fin:false};S.fx='.page>*:not(.head)';break}
  case'qreset':S.quiz.run=null;break;
  case'qagain':{const r=S.quiz.run;S.quiz.run={s:r.s,topic:r.topic,i:0,pick:null,score:0,hint:false,fin:false};S.fx='.page>*:not(.head)';break}
  case'qhint':S.quiz.run.hint=true;S.fx='.hint';break;
  case'qpick':{const r=S.quiz.run,it=QB[r.s][r.i];r.pick=+v;if(r.pick===it[2])r.score++;S.fx='.opt.right,.opt.wrong,.card.pad[style*="-soft)"]';break}
  case'qnext':{const r=S.quiz.run;if(r.i+1<QB[r.s].length){r.i++;r.pick=null;r.hint=false}else{r.fin=true;S.quiz.hist.unshift({s:r.s,topic:r.topic,sc:r.score,n:QB[r.s].length})}S.fx='.page>*:last-child';break}
  case'tsug':S.tu.topic=v;break;
  case'tmode':S.tu.mode=v;break;
  case'tstart':{const u=S.tu;u.chat=[{h:L(TU[u.mode](u.subj,u.topic.trim()))}];S.fx='.chat .bubble';S.sc='.chat';break}
 }
 render();
});
document.addEventListener('input',e=>{
 const i=e.target.id;
 if(i==='aq')S.ask.q=e.target.value;
 if(i==='qt')S.quiz.topic=e.target.value;
 if(i==='tt')S.tu.topic=e.target.value;
});
document.addEventListener('change',e=>{
 const i=e.target.id;
 if(i==='qs'){S.quiz.subj=e.target.value}
 else if(i==='ts'){S.tu.subj=e.target.value}
 else if(i==='fi'||i==='fc'){handleFile(e.target.files[0]);return}
 else return;
 render();
});
document.addEventListener('submit',e=>{
 e.preventDefault();const id=e.target.id;
 if(id==='lf')login(document.getElementById('lg').value.trim().toLowerCase(),document.getElementById('pw').value);
 if(id==='af'){const q=S.ask.q.trim();if(q)runAsk(q)}
 if(id==='tf'){const inp=document.getElementById('tq'),v=inp.value.trim();if(!v)return;
  const uz=S.lang==='uz';S.tu.chat.push({me:1,h:v});
  S.tu.chat.push({h:uz?'Yaxshi fikr. Keling, uni bosqichma-bosqich tekshiramiz: avval asosiy qoidani eslang, so‘ng javobingizni unga qarab to‘g‘rilang. Demo versiyada javoblar tayyor shablon asosida beriladi.':'Хорошая мысль. Проверим по шагам: вспомните основное правило и сверьте с ним свой ответ. В демо-версии ответы даются по готовому шаблону.'});S.fx='.chat .bubble:nth-last-child(-n+2)';S.sc='.chat .bubble:last-child';render();
  const n=document.getElementById('tq');if(n)n.focus()}
});
document.addEventListener('dragover',e=>{const z=e.target.closest('#dz');if(z){e.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#dz');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
document.addEventListener('drop',e=>{if(e.target.closest('#dz')){e.preventDefault();handleFile(e.dataTransfer.files[0])}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.acct){S.acct=false;document.querySelector('.acct-pop')?.classList.remove('open')}});
window.addEventListener('hashchange',()=>{S.acct=false;document.querySelector('.acct-pop')?.classList.remove('open');
 const wasOpen=!!document.querySelector('.side.open');S.drawer=false;
 document.querySelector('.side')?.classList.remove('open');document.querySelector('.scrim')?.classList.remove('show');
 if(!S.user||route()===curKey)return;
 const pg=document.querySelector('.page');if(pg&&!RM)pg.classList.add('leaving');
 clearTimeout(navT);
 navT=setTimeout(()=>{S.anim=true;render();scrollTo({top:0,behavior:'instant'})},RM?0:(wasOpen?200:140));
});

function login(l,p){const a=ACC[l];if(a&&a.pw===p){S.user=a;S.loginErr=false;location.hash=a.role==='parent'?'ota-onam':'bosh';S.anim=true;render()}else{S.loginErr=true;S.fx='.err,.login-card input';render()}}
function runAsk(q){const a=S.ask;a.q=q;a.busy=true;a.res=null;render();setTimeout(()=>{a.res={q,...answerFor(q)};a.busy=false;a.q='';S.fx='.answer';render()},650)}
function handleFile(f){
 const s=S.snap;s.err=false;if(!f)return;
 if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>8*1024*1024){s.err=true;render();return}
 s.busy=true;s.img=null;render();
 const r=new FileReader();r.onload=()=>{setTimeout(()=>{s.img=r.result;s.busy=false;S.fx='.preview';S.sc='.preview';render()},900)};r.readAsDataURL(f);
}
render();

/* ---------- profile & developer panel ---------- */
function vProfil(){const u=S.user;
 return head('',L2('Profil','Профиль'),L2('Ism, familiya, sinf va rasmingizni o‘zgartiring.','Имя, фамилия, класс и фото.'))+
 `<div class="card pad" style="display:grid;gap:14px">

function vDev(){
 if(S.user.role!=='developer')return empty('flag',L2('Ruxsat yo‘q','Нет доступа'),'');
 const keys=Object.keys(ACC),k0=keys[0],a0=ACC[k0]||{};
 const rows=keys.map(k=>{const a=ACC[k];return `<div class="row"><span class="avatar" style="width:28px;height:28px;font-size:10px">${esc(a.ini||'')}</span><div class="grow"><div class="t">${esc(fullName(a))}</div><div class="meta"><span>${esc(k)}</span><span>${esc(a.role)}</span>${a.cls?`<span>${esc(a.cls)}</span>`:''}</div></div></div>`}).join('');
 const news=NEWS.map((n,i)=>`<div class="row"><div class="grow"><div class="t">${esc(n.uz[0])}</div><div class="meta"><span>${esc(n.uz[2]||'')}</span></div></div><button class="btn" data-act="dnews_del" data-v="${i}" aria-label="delete">${ic('x')}</button></div>`).join('');
 return head('',L2('Developer paneli','Панель разработчика'),L2('Saytdagi hisoblar va yangiliklarni to‘liq boshqaring.','Полное управление аккаунтами и новостями сайта.'))+
 `<section class="sect"><h2>${L2('Hisoblar','Аккаунты')}</h2><div class="card list">${rows}</div></section>
  <section class="sect"><h2>${L2('Hisobni tahrirlash','Редактирование аккаунта')}</h2><div class="card form">

   <label>${L2('Ism','Имя')}<input id="dname" type="text" value="${esc(a0.name||'')}"></label>

   <label>${L2('Rol','Роль')}<select id="drole">${ROLE_OPTS(a0.role)}</select></label>
   <label>${L2('Yangi parol (bo‘sh qoldirsangiz o‘zgarmaydi)','Новый пароль')}<input id="dpw" type="text" autocomplete="off"></label>
   <div class="chips"><button class="btn primary" data-act="dsave">${ic('check')} ${L2('Saqlash','Сохранить')}</button><button class="btn" data-act="ddel">${ic('x')} ${L2('O‘chirish','Удалить')}</button></div></div></section>
  <section class="sect"><h2>${L2('Yangi hisob','Новый аккаунт')}</h2><div class="card form">
   <label>${L2('Login','Логин')}<input id="nlg" type="text" autocapitalize="none" autocorrect="off"></label>
   <label>${L2('Parol','Пароль')}<input id="npw" type="text" autocomplete="off"></label>
   <label>${L2('Ism','Имя')}<input id="nname" type="text"></label>
   <label>${L2('Familiya','Фамилия')}<input id="nsur" type="text"></label>
   <label>${L2('Sinf','Класс')}<input id="ncls" type="text"></label>
   <label>${L2('Rol','Роль')}<select id="nrole">${ROLE_OPTS('student')}</select></label>
   <button class="btn primary block" data-act="dnew">${ic('check')} ${L2('Hisob yaratish','Создать аккаунт')}</button></div></section>
  <section class="sect"><h2>${L2('Yangiliklar','Новости')}</h2><div class="card list">${news||`<div class="row muted">—</div>`}</div>
   <div class="card form" style="margin-top:10px">

document.addEventListener('change',e=>{
 if(e.target.id==='pphoto'){const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);const img=new Image();
  img.onload=()=>{const sz=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=256;
   c.getContext('2d').drawImage(img,(img.width-sz)/2,(img.height-sz)/2,sz,sz,0,0,256,256);
   const k=userKey();if(k){ACC[k].photo=c.toDataURL('image/jpeg',0.85);S.user=ACC[k];saveAcc()}
   URL.revokeObjectURL(url);render()};img.src=url;return}
 if(e.target.id==='dk'){const a=ACC[e.target.value]||{};
  document.getElementById('dname').value=a.name||'';document.getElementById('dsur').value=a.surname||'';
  document.getElementById('dcls').value=a.cls||'';document.getElementById('drole').value=a.role||'student';document.getElementById('dpw').value=''}
});

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 const mine=['pfsave','pfnophoto','dsave','ddel','dnew','dnews_add','dnews_del','dreset','dsite_save','ttedit','ttsave','ttreset'];
 if(!mine.includes(a))return;
 e.stopPropagation();e.preventDefault();
 const g=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
 const isDev=S.user&&S.user.role==='developer';
 if(a.startsWith('d')&&!isDev){alert('Faqat developer uchun.');return}
 if(a==='pfsave'){const k=userKey();if(!k)return;const x=ACC[k];const nm=g('pname');
  if(!nm){alert('Ism bo‘sh bo‘lmasligi kerak.');return}
  x.name=nm;x.surname=g('psur');x.cls=g('pcls');const pw=g('ppw');if(pw)x.pw=pw;x.ini=initOf(x);
  saveAcc();S.user=x;render();return}
 if(a==='pfnophoto'){const k=userKey();if(k){delete ACC[k].photo;saveAcc();S.user=ACC[k]}render();return}
 if(a==='dsave'){const k=g('dk');const x=ACC[k];if(!x)return;
  x.name=g('dname')||x.name;x.surname=g('dsur');x.cls=g('dcls');const r=g('drole')||x.role;
  if(k==='developer'&&r!=='developer'){alert('Developer hisobining roli o‘zgarmaydi.')}else{x.role=r}
  const pw=g('dpw');if(pw)x.pw=pw;x.ini=initOf(x);saveAcc();if(S.user===x)S.user=x;render();return}
 if(a==='ddel'){const k=g('dk');if(k==='developer'){alert('Developer hisobini o‘chirib bo‘lmaydi.');return}
  if(!ACC[k])return;if(!confirm(k+' hisobini o‘chirasizmi?'))return;delete ACC[k];saveAcc();render();return}
 if(a==='dnew'){const k=g('nlg').toLowerCase();const pw=g('npw');
  if(!k||!pw){alert('Login va parol kiritilishi shart.');return}
  if(ACC[k]){alert('Bunday login mavjud.');return}
  ACC[k]={pw,role:g('nrole')||'student',name:g('nname')||k,surname:g('nsur'),cls:g('ncls'),photo:''};ACC[k].ini=initOf(ACC[k]);
  saveAcc();render();return}
 if(a==='dnews_add'){const title=g('dntitle');if(!title){alert('Sarlavha kiritilishi shart.');return}
  const text=g('dntext'),meta=g('dnmeta')||'Yangilik';
  NEWS.unshift({i:'cal',uz:[title,text,meta],ru:[title,text,meta]});saveNews();render();return}
 if(a==='dnews_del'){NEWS.splice(+b.dataset.v,1);saveNews();render();return}
 if(a==='ttedit'){ttEdit=!ttEdit;render();return}
 if(a==='ttsave'){const d=S.day;const base=JSON.parse(JSON.stringify(ttWeek()));
  base[d]=SLOT.map((_,i)=>{const el=document.getElementById('tt-'+i);return el&&el.value?el.value:null});
  try{localStorage.setItem('ps-tt-'+userKey(),JSON.stringify(base))}catch(err){alert('Saqlashda xatolik')}
  ttEdit=false;render();return}
 if(a==='ttreset'){try{localStorage.removeItem('ps-tt-'+userKey())}catch(err){}ttEdit=false;render();return}
 if(a==='dsite_save'){let o;try{o=JSON.parse(document.getElementById('sjson').value)}catch(err){alert('JSON xato: '+err.message);return}
  const need=['T','ROOMS','TEACH','SLOT','WEEK','HW','NEWS'];
  if(!o||typeof o!=='object'||need.some(k=>o[k]===undefined)){alert('Majburiy bo‘limlar yetishmayapti: '+need.join(', '));return}
  o.cls=g('scls')||o.cls||'8-A';
  try{localStorage.setItem('ps-site',JSON.stringify(o));localStorage.setItem('ps-news',JSON.stringify(o.NEWS))}catch(err){alert('Saqlashda xatolik');return}
  location.reload();return}
 if(a==='dreset'){if(!confirm('Barcha hisob va yangilik o‘zgarishlari o‘chadi. Davom etasizmi?'))return;
  try{localStorage.removeItem('ps-accounts');localStorage.removeItem('ps-news');localStorage.removeItem('ps-site')}catch(x){}location.reload();return}
},true);
